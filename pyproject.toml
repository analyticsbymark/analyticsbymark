[project]
name = "analyticsbymark"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Requirements for core
    "jinja2~=3.1", #"jinja2~=3.0",
    "markdown~=3.2",
    "mkdocs~=1.6",
    "mkdocs-material-extensions~=1.3",
    "pygments~=2.16",
    "pymdown-extensions~=10.2",
    # Requirements for plugins
    "babel~=2.10",
    "colorama~=0.4",
    "mergedeep~=1.3",
    "paginate~=0.5",
    "regex>=2022.4",
    "requests~=2.26",
    "mkdocs-rss-plugin>=1.17.3",
    "mkdocs-material",
    "mkdocs-macros-plugin>=1.3.9",
    "pyyaml-env-tag>=1.1",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.1.1",
    "sqlmodel>=0.0.25",
    "pandas>=2.3.3",
    "pydantic-settings>=2.11.0",
    # Visualization & tutorial dependencies
    "plotly==5.21.0",
    "dash==2.16.1",
    "kaleido==0.2.1",
    "black>=23.0.0",
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["projects"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv.sources]
mkdocs-material = { git = "https://github.com/squidfunk/mkdocs-material-insiders.git" }
