{% if abm_noindex %}
  <meta name="robots" content="noindex">
{% endif %}
{% if abm_structured_data %}
  {% set article = abm_structured_data[0] %}
  <meta property="og:description" content="{{ article.description | e }}">
  <meta name="twitter:description" content="{{ article.description | e }}">
  <meta property="article:published_time" content="{{ article.datePublished | e }}">
  <meta property="article:modified_time" content="{{ article.dateModified | e }}">
  {% for tag in page.meta.get("tags", []) %}
    <meta property="article:tag" content="{{ tag | e }}">
  {% endfor %}
  {% for item in abm_structured_data %}
    <script type="application/ld+json">{{ item | tojson }}</script>
  {% endfor %}
{% endif %}
