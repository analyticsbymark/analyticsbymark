# =============================================================================
# Social Card: Tutorial
# =============================================================================
# For step-by-step tutorial pages. Shows a step/series indicator, page title,
# tags, and a decorative page icon.
#
# Frontmatter options:
#   icon: material/chart-bar       (decorative background icon)
#   tags: [plotly, bar-chart]      (shown at bottom)
#
# Usage in frontmatter:
#   social:
#     cards_layout: tutorial
# =============================================================================

definitions:

  - &logo >-
    docs/assets/logo.png

  - &page_title >-
    {{ page.meta.get("title", page.title) }}

  - &page_description >-
    {%- if page.meta.description -%}
    {{ page.meta.description }}
    {%- endif -%}

size: { width: 1200, height: 630 }

layers:

  # Background — darker teal for tutorial depth
  - background:
      color: "#2A3A36"

  # Left accent bar — brand teal stripe
  - size: { width: 6, height: 630 }
    offset: { x: 0, y: 0 }
    background:
      color: "#5C8076"

  # Decorative page icon — large, translucent, right side
  - size: { width: 400, height: 400 }
    offset: { x: 760, y: 160 }
    icon:
      value: >-
        {{ page.meta.get("icon", "material/school-outline") }}
      color: "#5C807618"

  # "TUTORIAL" badge — top-left
  - size: { width: 160, height: 32 }
    offset: { x: 64, y: 48 }
    background:
      color: "#5C8076"

  - size: { width: 140, height: 28 }
    offset: { x: 74, y: 50 }
    typography:
      content: TUTORIAL
      color: "#FFFFFF"
      align: center
      font:
        family: Roboto
        style: Bold

  # ABM logo — top-right
  - size: { width: 56, height: 56 }
    offset: { x: 1080, y: 40 }
    background:
      image: *logo

  # Thin horizontal rule below badge
  - size: { width: 1072, height: 2 }
    offset: { x: 64, y: 110 }
    background:
      color: "#5C807633"

  # Page title — large
  - size: { width: 900, height: 260 }
    offset: { x: 64, y: 140 }
    typography:
      content: *page_title
      color: "#FFFFFF"
      align: start
      overflow: shrink
      line:
        amount: 3
        height: 1.25
      font:
        family: Roboto
        style: Bold

  # Description — below title
  - size: { width: 700, height: 64 }
    offset: { x: 64, y: 420 }
    typography:
      content: *page_description
      color: "#5C8076"
      align: start
      overflow: truncate
      line:
        amount: 2
        height: 1.3
      font:
        family: Roboto
        style: Regular

  # Tags icon
  - size: { width: 24, height: 24 }
    offset: { x: 64, y: 540 }
    icon:
      value: >-
        {%- if page.meta.tags -%}
        material/tag-outline
        {%- endif -%}
      color: "#5C8076"

  # Tags text
  - size: { width: 600, height: 24 }
    offset: { x: 100, y: 540 }
    typography:
      content: >-
        {%- if page.meta.tags -%}
        {{ page.meta.tags | join(" / ") }}
        {%- endif -%}
      color: "#5C8076"
      align: start
      font:
        family: Roboto
        style: Medium

  # Site URL — bottom right
  - size: { width: 300, height: 24 }
    offset: { x: 836, y: 540 }
    typography:
      content: analyticsbymark.dev
      color: "#5C807644"
      align: end
      font:
        family: Roboto
        style: Regular
