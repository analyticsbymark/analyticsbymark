site_name: ABM - Blog
site_description: My journey in building datasets and designing analytics that deliver actionable results in insurance.

## Copyright
#copyright: Copyright &copy; 2024 - 2025 Mark Cooper

theme:
  name: material
  logo: assets/logo.png
  features:
    - navigation.indexes
    - content.code.annotate

plugins:
  - search
  - blog:
      blog_toc: true
      archive_date_format: MMMM yyyy
      categories_allowed:
        - Data Engineering
        - Analytics
        - APIs
      pagination_per_page: 5
      archive_pagination_per_page: 10
      categories_pagination_per_page: 10
#      post_slugify: !!python/object/apply:ext.slugs.slugify
#        kwds:
#          short: true
  - meta
  - tags
  - rss:
      match_path: "blog/posts/.*"
      date_from_meta:
        as_creation: date.created
        as_update: date.updated

#extra:
#  social:
#    - icon: fontawesome/brands/linkedin
#      name: Mark on Linkedin
#      link: https://www.linkedin.com/in/mark-cooper-b8878686

hooks:
  - ../../hooks/socialmedia.py

markdown_extensions:
  - pymdownx.snippets: # embedding code from source
      base_path:
        - ".."          # <-- start at /projects
      check_paths: true
  - pymdownx.superfences # for code highlighting and admonition boxes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Tags: tags.md
  - Blog:
     - blog/index.md
     - blog/tags.md

extra_css:
  - assets/extra.css

extra_javascript:
  # client key designed for where the key itself cannot be secret -> safe in repo (https://docs.statsig.com/sdk-keys/api-keys/)
  - "https://cdn.jsdelivr.net/npm/statsig-sidecar/dist/index.min.js?apikey=client-o5NxMKGrDvcZ6sfYbs2081B5l63hu6dpI80652s6XE6"
  - "js/sidecar-activate.js"