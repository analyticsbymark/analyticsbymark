site_url: https://www.analyticsbymark.dev
site_name: ABM - Code Base
site_description: My dev site explaining datasets and analytics that deliver actionable results in insurance.

# Copyright
copyright: > 
  Copyright &copy; 2024 - 2025 Mark Cooper <br>
  <a href="#__consent">Change cookie settings</a>

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:

    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
  features:
    # https://squidfunk.github.io/mkdocs-material/setup/setting-up-navigation/
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch # hover over links to get preload
    - navigation.tracking # add tracking to the url for more precise links
    - navigation.tabs # adds menu to the header above certain screen size
    - navigation.tabs.sticky # when header tabs shown keeps them at top after scrolling
    #    - navigation.expand # left sidebar will expand all collapsible subsections :todo test this one when more items in sidebar
    - navigation.path # adds breadcrumb navigation to the top of the page
    - navigation.top # show back to top button after scrolling on a page
    - toc.follow # shows the active anchor in the table of contents
    - search.suggest # display the likeliest completion when searching
    - search.share # deep link search query + result to share
    - content.code.annotate


markdown_extensions:
  - admonition # highlighting sections of the page
  - attr_list # used by various extensions
  - md_in_html # used by various extensions
  - pymdownx.highlight: # syntax highlighting
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite # syntax highlighting
  - pymdownx.snippets: # embedding code from source
      base_path:
        - "."           # <-- start at /projects/dev (config file dir)
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed: # create tabs
      alternate_style: true
  - pymdownx.superfences # for code highlighting and admonition boxes
  - pymdownx.details  # for admonition boxes
#  - material.extensions.preview: todo enable this when ready to add links
#      configurations:
#        - targets:
#            include:
#              - changelog/index.md
#              - customization.md
#              - insiders/changelog/*
#              - setup/extensions/*


nav:
  - Home: index.md
  - Learn:
    - tutorial/index.md
    - tutorial/creating_policies.md
    - tutorial/sandbox.md

extra:
  analytics:
    provider: google
    property: G-QGKGYMC3V5
    consent:
    title: Cookie consent
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
extra_css:
  - assets/extra.css

extra_javascript:
  # Statsig SDK loaded in <head> via overrides/partials/integrations/analytics.html
  - "js/statsig/config/experiments.config.js"
  - "js/statsig/core/user.js"
  - "js/statsig/core/client.js"
  - "js/statsig/experiments/renderer.js"
  - "js/statsig/experiments/bootstrap.js"
  # Event tracking modules
  - "js/statsig/tracking/eventLogger.js"
  - "js/statsig/tracking/exposureLogger.js"
  - "js/statsig/tracking/clickTracker.js"
  - "js/statsig/tracking/engagementTracker.js"
  - "js/statsig/tracking/init.js"

