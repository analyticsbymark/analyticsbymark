# =============================================================================
# Social Card: Default
# =============================================================================
# Clean, professional card for any page on analyticsbymark.dev.
# Dark teal background with ABM logo, page title, and site name.
#
# Usage: Set as the default in mkdocs.yml or per-page frontmatter:
#   social:
#     cards_layout: default
# =============================================================================

definitions:

  - &logo >-
    docs/assets/logo.png

  - &page_title >-
    {{ page.meta.get("title", page.title) }}

  - &page_description >-
    {%- if page.meta.description -%}
    {{ page.meta.description }}
    {%- elif config.site_description -%}
    {{ config.site_description }}
    {%- endif -%}

size: { width: 1200, height: 630 }

layers:

  # Background — brand dark teal
  - background:
      color: "#384D48"

  # Subtle lighter panel on the right for depth
  - size: { width: 400, height: 630 }
    offset: { x: 800, y: 0 }
    background:
      color: "#2F403B"

  # ABM logo — top-left
  - size: { width: 72, height: 72 }
    offset: { x: 64, y: 48 }
    background:
      image: *logo

  # Site name — next to logo
  - size: { width: 400, height: 36 }
    offset: { x: 152, y: 64 }
    typography:
      content: "{{ config.site_name }}"
      color: "#5C8076"
      align: start
      font:
        family: Roboto
        style: Medium

  # Thin horizontal rule
  - size: { width: 1072, height: 2 }
    offset: { x: 64, y: 140 }
    background:
      color: "#5C807633"

  # Page title — large, main focus
  - size: { width: 1000, height: 280 }
    offset: { x: 64, y: 168 }
    typography:
      content: *page_title
      color: "#FFFFFF"
      align: start
      overflow: shrink
      line:
        amount: 3
        height: 1.25
      font:
        family: Roboto
        style: Bold

  # Page description
  - size: { width: 700, height: 80 }
    offset: { x: 64, y: 480 }
    typography:
      content: *page_description
      color: "#5C8076"
      align: start
      overflow: truncate
      line:
        amount: 2
        height: 1.3
      font:
        family: Roboto
        style: Regular

  # Site URL — bottom right
  - size: { width: 300, height: 28 }
    offset: { x: 836, y: 560 }
    typography:
      content: analyticsbymark.dev
      color: "#5C807666"
      align: end
      font:
        family: Roboto
        style: Regular
