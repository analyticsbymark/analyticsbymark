name: Build & Publish MkDocs Sites

on:
  workflow_dispatch:
  push:
    branches: ["develop", "master"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python (for MkDocs)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write experiment configs from secrets
        env:
          EXPERIMENT_CONFIG_JSON_DEV: ${{ secrets.EXPERIMENT_CONFIG_JSON_DEV }}
          EXPERIMENT_CONFIG_JSON_BLOG: ${{ secrets.EXPERIMENT_CONFIG_JSON_BLOG }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          function write(outPath, raw) {
            if (!raw || !raw.trim()) return;
            const obj = JSON.parse(raw); // validate
            fs.mkdirSync(path.dirname(outPath), { recursive: true });
            fs.writeFileSync(outPath, `window.EXPERIMENT_CONFIG = ${JSON.stringify(obj)};\n`);
            console.log("Wrote", outPath);
          }

          write("projects/dev/docs/js/experiments.config.js", process.env.EXPERIMENT_CONFIG_JSON_DEV);
          write("projects/blog/docs/js/experiments.config.js", process.env.EXPERIMENT_CONFIG_JSON_BLOG);
          NODE

      - name: Build analyticsbymark.dev
        run: |
          mkdocs build \
            --strict \
            --config-file projects/dev/mkdocs.yml \
            --site-dir _build/analyticsbymark-dev

      - name: Build analyticsbymark.blog
        run: |
          mkdocs build \
            --strict \
            --config-file projects/blog/mkdocs.yml \
            --site-dir _build/analyticsbymark-blog

      - name: Select deploy branch
        id: deploy
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "branch=" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "branch=gh-pages-uat" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "branch=gh-pages-prod" >> "$GITHUB_OUTPUT"
          else
            echo "branch=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish built sites
        if: steps.deploy.outputs.branch != ''
        env:
          DEPLOY_BRANCH: ${{ steps.deploy.outputs.branch }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          echo "Deploying to: $DEPLOY_BRANCH"
          echo "PWD: $(pwd)"
          echo "Listing _build:"
          ls -la "_build" || true
          echo "Listing dev:"
          ls -la "_build/analyticsbymark-dev" || true
          echo "Listing blog:"
          ls -la "_build/analyticsbymark-blog" || true

          if [ ! -d "_build/analyticsbymark-dev" ]; then
            echo "ERROR: Missing _build/analyticsbymark-dev"
            exit 1
          fi
          if [ ! -d "_build/analyticsbymark-blog" ]; then
            echo "ERROR: Missing _build/analyticsbymark-blog"
            exit 1
          fi

          rm -rf _ghpages
          mkdir -p _ghpages
          cd _ghpages

          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git fetch origin "${DEPLOY_BRANCH}" --depth=1; then
            git checkout -b "${DEPLOY_BRANCH}" "origin/${DEPLOY_BRANCH}"
          else
            git checkout --orphan "${DEPLOY_BRANCH}"
          fi

          rm -rf ./*

          cp -r ../_build/analyticsbymark-dev .
          cp -r ../_build/analyticsbymark-blog .
          touch .nojekyll

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi

          git commit -m "Deploy ${GITHUB_REF_NAME} → ${DEPLOY_BRANCH} (${GITHUB_SHA})"
          git push origin "${DEPLOY_BRANCH}"
      
