name: Build MkDocs sites

on:
  workflow_dispatch:
  pull_request:
    branches: ["develop"]
  push:
    branches: ["develop"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      # Checkout
      # ---------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------
      # Python
      # ---------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ---------------------------
      # Install dependencies
      # ---------------------------
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ---------------------------------------
      # Write experiment configs from secrets
      # ---------------------------------------
      - name: Write experiment configs
        env:
          EXPERIMENT_CONFIG_JSON_DEV: ${{ secrets.EXPERIMENT_CONFIG_JSON_DEV }}
          EXPERIMENT_CONFIG_JSON_BLOG: ${{ secrets.EXPERIMENT_CONFIG_JSON_BLOG }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          function writeConfig(outPath, json) {
            if (!json || !json.trim()) {
              console.log(`No config provided for ${outPath}, skipping`);
              return;
            }

            JSON.parse(json); // validate JSON

            fs.mkdirSync(path.dirname(outPath), { recursive: true });
            fs.writeFileSync(outPath, `window.EXPERIMENT_CONFIG = ${json};\n`);
            console.log(`Wrote ${outPath}`);
          }

          writeConfig(
            "projects/dev/docs/js/experiments.config.js",
            process.env.EXPERIMENT_CONFIG_JSON_DEV
          );

          writeConfig(
            "projects/blog/docs/js/experiments.config.js",
            process.env.EXPERIMENT_CONFIG_JSON_BLOG
          );
          NODE

      # ---------------------------
      # Build DEV site
      # ---------------------------
      - name: Build DEV site
        run: |
          mkdocs build \
            --strict \
            --config-file projects/dev/mkdocs.yml \
            --site-dir projects/dev/site

      # ---------------------------
      # Build BLOG site
      # ---------------------------
      - name: Build BLOG site
        run: |
          mkdocs build \
            --strict \
            --config-file projects/blog/mkdocs.yml \
            --site-dir projects/blog/site

      # ---------------------------
      # Upload artifacts (optional)
      # ---------------------------
      - name: Upload DEV site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dev
          path: projects/dev/site

      - name: Upload BLOG site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-blog
          path: projects/blog/site
