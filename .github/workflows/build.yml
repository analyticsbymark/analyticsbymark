name: Build & Publish MkDocs Sites

on:
  workflow_dispatch:
  push:
    branches: ["develop", "master"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write experiment configs
        env:
          EXPERIMENT_CONFIG_JSON_DEV: ${{ secrets.EXPERIMENT_CONFIG_JSON_DEV }}
          EXPERIMENT_CONFIG_JSON_BLOG: ${{ secrets.EXPERIMENT_CONFIG_JSON_BLOG }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          function validateConfig(obj) {
            // Basic validation
            if (!obj.client?.apiKey) {
              throw new Error("Missing client.apiKey in config");
            }
            if (!obj.experiments) {
              throw new Error("Missing experiments in config");
            }
            console.log("  ✓ Config validation passed");
            return true;
          }

          function write(outPath, raw) {
            if (!raw || !raw.trim()) {
              console.log(`  ⊘ Skipping ${outPath} (no config provided)`);
              return;
            }

            try {
              // Parse JSON
              const obj = JSON.parse(raw);

              // Validate config
              validateConfig(obj);

              // Ensure output directory exists
              fs.mkdirSync(path.dirname(outPath), { recursive: true });

              // Write config file
              fs.writeFileSync(
                outPath,
                `window.EXPERIMENT_CONFIG = ${JSON.stringify(obj, null, 2)};\n`
              );

              // Count experiments
              let experimentCount = 0;
              if (obj.experiments) {
                for (const category of Object.values(obj.experiments)) {
                  if (typeof category === 'object') {
                    experimentCount += Object.keys(category).length;
                  }
                }
              }

              console.log(`  ✓ Wrote ${outPath}`);
              console.log(`    Environment: ${obj._meta?.environment || 'unknown'}`);
              console.log(`    Experiments: ${experimentCount}`);
            } catch (error) {
              console.error(`  ✗ Error writing ${outPath}:`, error.message);
              process.exit(1);
            }
          }

          console.log("Writing experiment configs...");
          write("projects/dev/docs/js/statsig/config/experiments.config.js", process.env.EXPERIMENT_CONFIG_JSON_DEV);
          write("projects/blog/docs/js/statsig/config/experiments.config.js", process.env.EXPERIMENT_CONFIG_JSON_BLOG);
          console.log("Done!");
          NODE

      - name: Build analyticsbymark.dev
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_build"
          mkdocs build \
            --strict \
            --config-file "$GITHUB_WORKSPACE/projects/dev/mkdocs.yml" \
            --site-dir "$GITHUB_WORKSPACE/_build/analyticsbymark-dev"

      - name: Build analyticsbymark.blog
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_build"
          mkdocs build \
            --strict \
            --config-file "$GITHUB_WORKSPACE/projects/blog/mkdocs.yml" \
            --site-dir "$GITHUB_WORKSPACE/_build/analyticsbymark-blog"
      

      - name: Select deploy branch
        id: deploy
        run: |
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "branch=gh-pages-uat" >> $GITHUB_OUTPUT
          elif [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "branch=gh-pages-prod" >> $GITHUB_OUTPUT
          else
            echo "branch=" >> $GITHUB_OUTPUT
          fi

      - name: Publish built sites
        if: steps.deploy.outputs.branch != '' && github.event_name != 'pull_request'
        env:
          DEPLOY_BRANCH: ${{ steps.deploy.outputs.branch }}
        run: |
          set -euo pipefail
          
          pwd
          ls -la "$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE/_build" || true
          
          cd "$GITHUB_WORKSPACE"


          echo "Deploying to: $DEPLOY_BRANCH"
          ls -la _build
          test -d "_build/analyticsbymark-dev"
          test -d "_build/analyticsbymark-blog"

          rm -rf _ghpages
          mkdir -p _ghpages
          cd _ghpages

          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          # Create/update branch from scratch
          git checkout --orphan "$DEPLOY_BRANCH"
          rm -rf ./*

          cp -r ../_build/analyticsbymark-dev .
          cp -r ../_build/analyticsbymark-blog .
          touch .nojekyll

          git add -A
          git commit -m "Deploy ${GITHUB_REF_NAME} → ${DEPLOY_BRANCH} (${GITHUB_SHA})" || true
          git push -f origin "$DEPLOY_BRANCH"
