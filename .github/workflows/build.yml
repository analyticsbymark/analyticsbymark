name: Build MkDocs sites

on:
  workflow_dispatch:
  pull_request:
    branches: ["develop"]
  push:
    branches: ["develop", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # MkDocs is a Python tool, so we need Python + pip install
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install MkDocs + plugins
        run: |
          python -m pip install --upgrade pip
          # Minimum needed for Material
          pip install mkdocs mkdocs-material

          # If you use extra plugins, add them here, e.g.:
          # pip install mkdocs-blogging-plugin mkdocs-rss-plugin

      # ---------------------------------------
      # Write experiment configs from secrets
      # ---------------------------------------
      - name: Write experiment configs
        env:
          EXPERIMENT_CONFIG_JSON_DEV: ${{ secrets.EXPERIMENT_CONFIG_JSON_DEV }}
          EXPERIMENT_CONFIG_JSON_BLOG: ${{ secrets.EXPERIMENT_CONFIG_JSON_BLOG }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          function writeConfig(outPath, json) {
            if (!json || !json.trim()) {
              console.log(`No config provided for ${outPath}, skipping`);
              return;
            }

            // Validate JSON
            JSON.parse(json);

            fs.mkdirSync(path.dirname(outPath), { recursive: true });
            fs.writeFileSync(outPath, `window.EXPERIMENT_CONFIG = ${json};\n`);

            console.log(`Wrote ${outPath}`);
          }

          writeConfig("dev/docs/js/experiments.config.js", process.env.EXPERIMENT_CONFIG_JSON_DEV);
          writeConfig("projects/blog/docs/js/experiments.config.js", process.env.EXPERIMENT_CONFIG_JSON_BLOG);
          NODE

      # ---------------------------------------
      # Build DEV site
      # ---------------------------------------
      - name: Build DEV site
        run: |
          mkdocs build \
            --strict \
            --config-file dev/mkdocs.yml \
            --site-dir dev/site

      # ---------------------------------------
      # Build BLOG site
      # ---------------------------------------
      - name: Build BLOG site
        run: |
          mkdocs build \
            --strict \
            --config-file projects/blog/mkdocs.yml \
            --site-dir projects/blog/site

      # Optional: upload artifacts so you can inspect the output from Actions
      - name: Upload DEV site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dev
          path: dev/site

      - name: Upload BLOG site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-blog
          path: projects/blog/site
