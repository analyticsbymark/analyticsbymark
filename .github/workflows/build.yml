name: Build & Publish Site

on:
  workflow_dispatch:
  push:
    branches: ["develop", "master"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cairo system dependencies (social cards)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libffi-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v

      - name: Build site
        run: uv run mkdocs build --strict -f website/mkdocs.yml --site-dir "$GITHUB_WORKSPACE/_build/analyticsbymark-blog"

      - name: Select deploy branch
        id: deploy
        run: |
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "branch=gh-pages-uat" >> $GITHUB_OUTPUT
          elif [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "branch=gh-pages-prod" >> $GITHUB_OUTPUT
          else
            echo "branch=" >> $GITHUB_OUTPUT
          fi

      - name: Block production deploy while the newsletter form is a placeholder
        if: github.ref_name == 'master' && github.event_name != 'pull_request'
        run: |
          if grep -q "placeholder: true" website/mkdocs.yml; then
            echo "::error::extra.newsletter.placeholder is still true in website/mkdocs.yml. Add the real Mailchimp form URL first."
            exit 1
          fi

      - name: Publish built site
        if: steps.deploy.outputs.branch != '' && github.event_name != 'pull_request'
        env:
          DEPLOY_BRANCH: ${{ steps.deploy.outputs.branch }}
        run: |
          set -euo pipefail
          test -d "_build/analyticsbymark-blog"

          rm -rf _ghpages
          mkdir -p _ghpages
          cd _ghpages

          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          git checkout --orphan "$DEPLOY_BRANCH"
          rm -rf ./*

          # Folder name kept as-is so the existing DigitalOcean source directory keeps working.
          cp -r ../_build/analyticsbymark-blog .
          touch .nojekyll

          git add -A
          git commit -m "Deploy ${GITHUB_REF_NAME} → ${DEPLOY_BRANCH} (${GITHUB_SHA})" || true
          git push -f origin "$DEPLOY_BRANCH"
