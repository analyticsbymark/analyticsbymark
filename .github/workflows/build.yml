name: Build & Publish MkDocs Sites

on:
  workflow_dispatch:
  push:
    branches: ["develop", "master"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: write   # required to push to gh-pages-* branches

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      # Checkout source
      # ---------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------
      # Python (MkDocs)
      # ---------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------
      # Write experiment configs
      # ---------------------------
      - name: Write experiment configs
        env:
          EXPERIMENT_CONFIG_JSON_DEV: ${{ secrets.EXPERIMENT_CONFIG_JSON_DEV }}
          EXPERIMENT_CONFIG_JSON_BLOG: ${{ secrets.EXPERIMENT_CONFIG_JSON_BLOG }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          function write(outPath, raw) {
            if (!raw || !raw.trim()) return;
            const obj = JSON.parse(raw);
            fs.mkdirSync(path.dirname(outPath), { recursive: true });
            fs.writeFileSync(
              outPath,
              `window.EXPERIMENT_CONFIG = ${JSON.stringify(obj)};\n`
            );
            console.log("Wrote", outPath);
          }

          write(
            "projects/dev/docs/js/experiments.config.js",
            process.env.EXPERIMENT_CONFIG_JSON_DEV
          );

          write(
            "projects/blog/docs/js/experiments.config.js",
            process.env.EXPERIMENT_CONFIG_JSON_BLOG
          );
          NODE

      # ---------------------------
      # Build both sites
      # ---------------------------
      - name: Build analyticsbymark.dev
        run: |
          mkdocs build \
            --strict \
            --config-file projects/dev/mkdocs.yml \
            --site-dir _build/analyticsbymark-dev

      - name: Build analyticsbymark.blog
        run: |
          mkdocs build \
            --strict \
            --config-file projects/blog/mkdocs.yml \
            --site-dir _build/analyticsbymark-blog

      # ---------------------------
      # Decide deploy branch
      # ---------------------------
      - name: Select deploy branch
        id: deploy
        run: |
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "branch=gh-pages-uat" >> $GITHUB_OUTPUT
          elif [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "branch=gh-pages-prod" >> $GITHUB_OUTPUT
          else
            echo "branch=" >> $GITHUB_OUTPUT
          fi

      # ---------------------------
      # Publish to gh-pages-*
      # ---------------------------
      - name: Publish built sites
        if: steps.deploy.outputs.branch != ''
        run: |
          set -e

          DEPLOY_BRANCH="${{ steps.deploy.outputs.branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Move build output somewhere safe BEFORE checkout
          rm -rf /tmp/deploy
          mkdir -p /tmp/deploy
          cp -r _build/analyticsbymark-dev /tmp/deploy/
          cp -r _build/analyticsbymark-blog /tmp/deploy/

          # Fetch deploy branch
          git fetch origin $DEPLOY_BRANCH || true

          if git show-ref --quiet refs/remotes/origin/$DEPLOY_BRANCH; then
            git checkout $DEPLOY_BRANCH
            git rm -rf .
          else
            git checkout --orphan $DEPLOY_BRANCH
            git rm -rf .
          fi

          # Copy back built output
          cp -r /tmp/deploy/analyticsbymark-dev .
          cp -r /tmp/deploy/analyticsbymark-blog .

          touch .nojekyll

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi

          git commit -m "Deploy ${GITHUB_REF_NAME} → ${DEPLOY_BRANCH} (${GITHUB_SHA})"
          git push origin $DEPLOY_BRANCH
      
      

