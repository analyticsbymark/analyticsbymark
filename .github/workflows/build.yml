name: Build & Publish MkDocs Sites

on:
  workflow_dispatch:
  push:
    branches: ["develop", "master"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: write   # required to push to gh-pages-* branches

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      # Checkout source
      # ---------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------
      # Python (MkDocs)
      # ---------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------
      # Write experiment configs
      # ---------------------------
      - name: Write experiment configs
        env:
          EXPERIMENT_CONFIG_JSON_DEV: ${{ secrets.EXPERIMENT_CONFIG_JSON_DEV }}
          EXPERIMENT_CONFIG_JSON_BLOG: ${{ secrets.EXPERIMENT_CONFIG_JSON_BLOG }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          function write(outPath, raw) {
            if (!raw || !raw.trim()) return;
            const obj = JSON.parse(raw);
            fs.mkdirSync(path.dirname(outPath), { recursive: true });
            fs.writeFileSync(
              outPath,
              `window.EXPERIMENT_CONFIG = ${JSON.stringify(obj)};\n`
            );
            console.log("Wrote", outPath);
          }

          write(
            "projects/dev/docs/js/experiments.config.js",
            process.env.EXPERIMENT_CONFIG_JSON_DEV
          );

          write(
            "projects/blog/docs/js/experiments.config.js",
            process.env.EXPERIMENT_CONFIG_JSON_BLOG
          );
          NODE

      # ---------------------------
      # Build both sites
      # ---------------------------
      - name: Build analyticsbymark.dev
        run: |
          mkdocs build \
            --strict \
            --config-file projects/dev/mkdocs.yml \
            --site-dir _build/analyticsbymark-dev

      - name: Build analyticsbymark.blog
        run: |
          mkdocs build \
            --strict \
            --config-file projects/blog/mkdocs.yml \
            --site-dir _build/analyticsbymark-blog

      # ---------------------------
      # Decide deploy branch
      # ---------------------------
      - name: Select deploy branch
        id: deploy
        run: |
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "branch=gh-pages-uat" >> $GITHUB_OUTPUT
          elif [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "branch=gh-pages-prod" >> $GITHUB_OUTPUT
          else
            echo "branch=" >> $GITHUB_OUTPUT
          fi

      # ---------------------------
      # Publish to gh-pages-*
      # ---------------------------
      - name: Publish built sites
        if: steps.deploy.outputs.branch != ''
        env:
          DEPLOY_BRANCH: ${{ steps.deploy.outputs.branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -e

          rm -rf _publish
          mkdir -p _publish

          cp -r _build/analyticsbymark-dev _publish/analyticsbymark-dev
          cp -r _build/analyticsbymark-blog _publish/analyticsbymark-blog
          touch _publish/.nojekyll

          cd _publish

          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Deploy ${GITHUB_REF_NAME} → ${DEPLOY_BRANCH} (${GITHUB_SHA})"

          git branch -M "$DEPLOY_BRANCH"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin "$DEPLOY_BRANCH"
      

